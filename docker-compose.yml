services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: contextos
      POSTGRES_PASSWORD: contextos
      POSTGRES_DB: contextos
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U contextos -d contextos']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    command: redis-server --appendonly yes
    volumes: ['redis_data:/data']
volumes:
  postgres_data:
  redis_data:
